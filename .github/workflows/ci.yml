name: ci

# The full gate runs locally, before every push (scripts/check, installed as a
# pre-push hook with `scripts/check --install-hook`): lint, types, skills, the
# unit suite on this machine's Python and the 3.9 floor, the black-box suite,
# guard latency, mutation testing of changed guard files, and, when a push
# changes what agents run, the live scenarios. `scripts/check --full` adds
# coverage and full mutation; `--linux` runs the suite in a Linux container.
#
# CI keeps only what a laptop cannot vouch for: Linux, at the floor and the
# newest supported Python, for pull requests from people whose hooks we do not
# run. Standard runners are free for public repositories on github.com, so
# there it runs on every pull request. Elsewhere (an Enterprise Server, private
# mirrors) it runs only when started by hand, so no runner is needed.
#
# Never here: macOS (the local gate's platform; macOS runners cost about 10x),
# latency (shared runners are too noisy to gate on), mutation testing (slow,
# local), and live scenarios (they spend tokens and need a Kiro or Cursor
# login, which no hosted runner has).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (ubuntu, py${{ matrix.python }})
    if: github.server_url == 'https://github.com' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: git identity for test repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: versions
        run: python --version && git --version && ssh -V
      - name: unit tests and guard corpus (in-process)
        run: python tests/run.py
      - name: unit tests and guard corpus (black box against bin/st)
        run: python tests/run.py
        env:
          ST_TEST_MODE: subprocess

  static:
    # Outside contributors may not run the local gate; these are cheap.
    if: github.server_url == 'https://github.com' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - name: mypy --strict
        run: mypy src/surgical_team scripts/check && mypy --strict scripts/publish
      - name: ruff
        run: ruff check src scripts/check scripts/publish
      - name: skills
        run: scripts/validate-skills.sh
      - name: coverage (branch)
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          cd tests && coverage run --branch --source=../src -m unittest discover -s .
          coverage report --fail-under=85
